<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
{{ font_css|safe }}
:root { --from: {{ style.from_color }}; --to: {{ style.to_color }}; --accent: {{ style.accent }}; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1350px; overflow: hidden; }
body { font-family: 'Cairo', sans-serif; color: #fff; }
.slide { position: relative; width: 1080px; height: 1350px; padding: 72px; display: flex; flex-direction: column; direction: rtl;
  background: linear-gradient(160deg, var(--from) 0%, var(--to) 100%); }
.slide::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 15% 10%, rgba(255,255,255,0.12), transparent 45%); }
.header, .main, .footer { position: relative; z-index: 1; }
.header { display: flex; align-items: center; justify-content: space-between; height: 96px; }
.brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 800; }
.brand img { height: 72px; }
.chip { background: var(--accent); color: #0b1020; font-weight: 800; font-size: 28px; padding: 8px 26px; border-radius: 999px; }
.main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px; padding: 24px 0; }
.rule { width: 120px; height: 8px; background: var(--accent); border-radius: 4px; flex: none; }
.footer { display: flex; justify-content: space-between; align-items: center; font-size: 28px; opacity: .9; height: 72px; border-top: 2px solid rgba(255,255,255,.25); padding-top: 18px; }
{% block css %}{% endblock %}
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <div class="brand">{% if logo %}<img src="{{ logo }}" alt="">{% endif %}<span>{{ wordmark }}</span></div>
    <div class="chip">{{ style.label }}</div>
  </div>
  <div class="main">{% block main %}{% endblock %}</div>
  <div class="footer">{% block footer %}<span>{{ handle|bdi }}</span>{% endblock %}</div>
</div>
<script>
window.fitAll = function () {
  var failed = [];
  document.querySelectorAll('[data-fit]').forEach(function (el) {
    var max = parseInt(el.dataset.max, 10), min = parseInt(el.dataset.min, 10);
    var size = max;
    el.style.fontSize = size + 'px';
    while (el.scrollHeight > el.clientHeight + 1 && size > min) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
    if (el.scrollHeight > el.clientHeight + 1) { failed.push(el.dataset.fit); }
  });
  return failed;
};
</script>
</body>
</html>
